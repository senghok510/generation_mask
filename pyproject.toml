[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mask-diffusion"
version = "0.1.0"
description = "DDPM and Stable Diffusion implementations for realistic face-mask synthesis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "torchmetrics[image]>=1.0",
  "diffusers>=0.37",
  "accelerate>=1.13",
  "huggingface_hub>=0.34",
  "lpips>=0.1",
  "peft>=0.18",
  "pytorch-fid>=0.3",
  "scipy>=1.14",
  "tqdm>=4.66",
  "transformers>=4.57",
  "safetensors>=0.7",
]

[project.scripts]
maskdiff-prepare = "DDPM.data.maskedface_net:main"
maskdiff-train = "DDPM.training.train:main"
maskdiff-generate = "DDPM.inference.infer:main"
maskdiff-eval = "DDPM.evaluation.eval:main"
maskdiff-train-mask = "DDPM.mask_predictor.train:main"
maskdiff-predict-mask = "DDPM.mask_predictor.infer:main"
maskdiff-pipeline = "DDPM.inference.pipeline:main"
sd-download-ffhq = "StableDiffusion.download_ffhq_subset:main"
sd-prepare-dataset = "StableDiffusion.prepare_paper_dataset:main"
sd-train = "StableDiffusion.train_sd_fullframe_lora:main"
sd-generate = "StableDiffusion.generate_sd_fullframe_results:main"
sd-eval-pairs = "StableDiffusion.run_pair_metrics:main"
sd-eval-fid = "StableDiffusion.run_pytorch_fid:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
